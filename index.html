<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offset Manager Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #475569;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .search-bar {
            flex: 1;
            min-width: 300px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text);
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 10px 20px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-tab:hover {
            border-color: var(--primary);
        }

        .filter-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .table-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-card);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        td {
            padding: 15px;
            border-top: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .offset-name {
            font-weight: 600;
            color: var(--primary);
        }

        .offset-value {
            font-family: 'Courier New', monospace;
            color: var(--warning);
        }

        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .category-anticheat { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .category-aimbot { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
        .category-esp { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .category-player_info { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
        .category-weapon { background: rgba(236, 72, 153, 0.2); color: #f9a8d4; }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .verified-true {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .verified-false {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--bg-card);
            color: var(--text);
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border);
        }

        .modal-header {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 2000;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-info { background: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Offset Manager Dashboard</h1>
            <p>Real-time offset management system for game modding</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalOffsets">0</div>
                <div class="stat-label">Total Offsets</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="verifiedOffsets">0</div>
                <div class="stat-label">Verified</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="categoriesCount">0</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="lastUpdate">-</div>
                <div class="stat-label">Last Update</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search offsets...">
            </div>
            <button class="btn btn-primary" onclick="showAddModal()">
                ➕ Add Offset
            </button>
            <button class="btn btn-success" onclick="refreshOffsets()">
                🔄 Refresh
            </button>
            <button class="btn btn-warning" onclick="exportOffsets()">
                📥 Export
            </button>
            <button class="btn btn-danger" onclick="resetAllOffsets()">
                ⚠️ Reset All
            </button>
        </div>

        <div class="filter-tabs">
            <div class="filter-tab active" data-category="all">All</div>
            <div class="filter-tab" data-category="anticheat">AntiCheat</div>
            <div class="filter-tab" data-category="aimbot">Aimbot</div>
            <div class="filter-tab" data-category="esp">ESP</div>
            <div class="filter-tab" data-category="player_info">Player Info</div>
            <div class="filter-tab" data-category="weapon">Weapon</div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Value</th>
                        <th>Description</th>
                        <th>Verified</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="offsetsTable">
                    <tr>
                        <td colspan="6" class="loading">
                            <div class="spinner"></div>
                            Loading offsets...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="offsetModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add New Offset</div>
            <form id="offsetForm">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="offsetName" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="offsetCategory" required>
                        <option value="anticheat">AntiCheat</option>
                        <option value="aimbot">Aimbot</option>
                        <option value="esp">ESP</option>
                        <option value="player_info">Player Info</option>
                        <option value="weapon">Weapon</option>
                        <option value="misc">Misc</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Value (Hex)</label>
                    <input type="text" id="offsetValue" placeholder="0x0" value="0x0">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="offsetDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="offsetVerified"> Verified
                    </label>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let offsetsData = [];
        let currentFilter = 'all';
        let editingOffset = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadOffsets();
            setupEventListeners();
        });

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterOffsets);
            
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.category;
                    filterOffsets();
                });
            });

            document.getElementById('offsetForm').addEventListener('submit', handleSubmit);
        }

        // Load offsets from API
        async function loadOffsets() {
            try {
                const response = await fetch(`${API_URL}/offsets`);
                const data = await response.json();
                offsetsData = data.offsets;
                updateStats(data);
                renderOffsets(offsetsData);
            } catch (error) {
                showToast('Error loading offsets', 'error');
                console.error(error);
            }
        }

        // Update statistics
        function updateStats(data) {
            document.getElementById('totalOffsets').textContent = data.offsets.length;
            document.getElementById('verifiedOffsets').textContent = 
                data.offsets.filter(o => o.verified).length;
            
            const categories = [...new Set(data.offsets.map(o => o.category))];
            document.getElementById('categoriesCount').textContent = categories.length;
            
            const lastUpdate = new Date(data.lastUpdate);
            document.getElementById('lastUpdate').textContent = lastUpdate.toLocaleTimeString();
        }

        // Render offsets table
        function renderOffsets(offsets) {
            const tbody = document.getElementById('offsetsTable');
            
            if (offsets.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No offsets found</td></tr>';
                return;
            }

            tbody.innerHTML = offsets.map(offset => `
                <tr>
                    <td class="offset-name">${offset.name}</td>
                    <td><span class="category-badge category-${offset.category}">${offset.category}</span></td>
                    <td class="offset-value">${formatHex(offset.value)}</td>
                    <td>${offset.description || '-'}</td>
                    <td>
                        <span class="verified-badge verified-${offset.verified}">
                            ${offset.verified ? '✓' : '✗'} ${offset.verified ? 'Yes' : 'No'}
                        </span>
                    </td>
                    <td class="actions">
                        <button class="icon-btn" onclick="editOffset('${offset.name}')" title="Edit">
                            ✏️
                        </button>
                        <button class="icon-btn" onclick="deleteOffset('${offset.name}')" title="Delete">
                            🗑️
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Filter offsets
        function filterOffsets() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = offsetsData;
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(o => o.category === currentFilter);
            }
            
            if (search) {
                filtered = filtered.filter(o => 
                    o.name.toLowerCase().includes(search) ||
                    o.description.toLowerCase().includes(search)
                );
            }
            
            renderOffsets(filtered);
        }

        // Format hex value
        function formatHex(value) {
            if (typeof value === 'number') {
                return '0x' + value.toString(16).toUpperCase().padStart(8, '0');
            }
            return value;
        }

        // Show add modal
        function showAddModal() {
            editingOffset = null;
            document.getElementById('modalTitle').textContent = 'Add New Offset';
            document.getElementById('offsetForm').reset();
            document.getElementById('offsetValue').value = '0x0';
            document.getElementById('offsetModal').classList.add('active');
        }

        // Edit offset
        function editOffset(name) {
            const offset = offsetsData.find(o => o.name === name);
            if (!offset) return;

            editingOffset = name;
            document.getElementById('modalTitle').textContent = 'Edit Offset';
            document.getElementById('offsetName').value = offset.name;
            document.getElementById('offsetName').disabled = true;
            document.getElementById('offsetCategory').value = offset.category;
            document.getElementById('offsetValue').value = formatHex(offset.value);
            document.getElementById('offsetDescription').value = offset.description || '';
            document.getElementById('offsetVerified').checked = offset.verified;
            document.getElementById('offsetModal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('offsetModal').classList.remove('active');
            document.getElementById('offsetName').disabled = false;
            editingOffset = null;
        }

        // Handle form submit
        async function handleSubmit(e) {
            e.preventDefault();

            const name = document.getElementById('offsetName').value;
            const category = document.getElementById('offsetCategory').value;
            const valueStr = document.getElementById('offsetValue').value;
            const description = document.getElementById('offsetDescription').value;
            const verified = document.getElementById('offsetVerified').checked;

            // Parse hex value
            let value = 0;
            if (valueStr) {
                value = parseInt(valueStr.replace('0x', ''), 16) || 0;
            }

            const data = { name, category, value, description, verified };

            try {
                if (editingOffset) {
                    await fetch(`${API_URL}/offsets/${name}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    showToast('Offset updated successfully', 'success');
                } else {
                    await fetch(`${API_URL}/offsets`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    showToast('Offset added successfully', 'success');
                }

                closeModal();
                loadOffsets();
            } catch (error) {
                showToast('Error saving offset', 'error');
                console.error(error);
            }
        }

        // Delete offset
        async function deleteOffset(name) {
            if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

            try {
                await fetch(`${API_URL}/offsets/${name}`, { method: 'DELETE' });
                showToast('Offset deleted', 'success');
                loadOffsets();
            } catch (error) {
                showToast('Error deleting offset', 'error');
                console.error(error);
            }
        }

        // Refresh offsets
        async function refreshOffsets() {
            showToast('Refreshing...', 'info');
            await loadOffsets();
            showToast('Offsets refreshed', 'success');
        }

        // Export offsets
        async function exportOffsets() {
            try {
                const response = await fetch(`${API_URL}/export`);
                const data = await response.json();
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `offsets_${Date.now()}.json`;
                a.click();
                
                showToast('Export successful', 'success');
            } catch (error) {
                showToast('Error exporting offsets', 'error');
                console.error(error);
            }
        }

        // Reset all offsets
        async function resetAllOffsets() {
            if (!confirm('Are you sure you want to reset ALL offsets to 0x0? This cannot be undone!')) return;

            try {
                await fetch(`${API_URL}/offsets/reset`, { method: 'POST' });
                showToast('All offsets reset to 0x0', 'success');
                loadOffsets();
            } catch (error) {
                showToast('Error resetting offsets', 'error');
                console.error(error);
            }
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
